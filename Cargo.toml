[workspace]
members = ["core", "windows"]
resolver = "2"

[workspace.dependencies]
wgpu = { version = "25", default-features = false, features = ["dx12", "wgsl"] }

[package]
name = "snowfall"
version = "0.1.0"
edition = "2021"

[dependencies]
snowfall-core = { path = "core" }

[target.'cfg(windows)'.dependencies]
snowfall-windows = { path = "windows" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
